# Controlled CI Error: Timeout Error
# Base workflow: test-linux.yml
# Error type: timeout-error
# Description: Sets an extremely short job-level timeout (1 minute) and then
#   adds a deliberate sleep of 90 seconds before the Build step.  The runner
#   kills the job when the timeout is exceeded and marks it as "timed out",
#   reproducing the real-world CI pattern of a job that hangs or runs too long.

name: Test Linux [timeout-error]

on:
  workflow_dispatch:
  pull_request:
    paths-ignore:
      - .mailmap
      - README.md
      - vcbuild.bat
      - tools/actions/**
      - tools/clang-format/**
      - tools/dep_updaters/**
      - test/internet/**
      - '**.nix'
      - .github/**
      - '!.github/workflows/test-linux_timeout-error.yaml'
    types: [opened, synchronize, reopened, ready_for_review]
  push:
    branches:
      - main
      - canary
      - v[0-9]+.x-staging
      - v[0-9]+.x
    paths-ignore:
      - .mailmap
      - README.md
      - vcbuild.bat
      - tools/actions/**
      - tools/clang-format/**
      - tools/dep_updaters/**
      - test/internet/**
      - '**.nix'
      - .github/**
      - '!.github/workflows/test-linux_timeout-error.yaml'

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

env:
  PYTHON_VERSION: '3.14'
  FLAKY_TESTS: keep_retrying
  CLANG_VERSION: '19'
  CC: ${{ (github.base_ref == 'main' || github.ref_name == 'main') && 'sccache' || '' }} clang-19
  CXX: ${{ (github.base_ref == 'main' || github.ref_name == 'main') && 'sccache' || '' }} clang++-19
  SCCACHE_GHA_ENABLED: ${{ github.base_ref == 'main' || github.ref_name == 'main' }}
  SCCACHE_IDLE_TIMEOUT: '0'
  RUSTC_VERSION: '1.82'

permissions:
  contents: read

jobs:
  test-linux:
    if: github.event.pull_request.draft == false
    # ERROR INJECTION: Cap the entire job at 1 minute.  The sleep step below
    # intentionally exceeds this limit, so GitHub Actions cancels the job and
    # marks it as "timed out" — the same signal produced by a legitimately
    # hung build or test suite.
    timeout-minutes: 1
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, ubuntu-24.04-arm]
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10  # v6.0.3
        with:
          persist-credentials: false
          path: node
      - name: Install Clang ${{ env.CLANG_VERSION }}
        uses: ./node/.github/actions/install-clang
        with:
          clang-version: ${{ env.CLANG_VERSION }}
      - name: Install Rust ${{ env.RUSTC_VERSION }}
        run: |
          rustup override set "$RUSTC_VERSION"
          rustup --version
      - name: Set up Python ${{ env.PYTHON_VERSION }}
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405  # v6.2.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          allow-prereleases: true
      - name: Set up sccache
        if: github.base_ref == 'main' || github.ref_name == 'main'
        uses: Mozilla-Actions/sccache-action@9e7fa8a12102821edf02ca5dbea1acd0f89a2696  # v0.0.10
        with:
          version: v0.12.0
      - name: Environment Information
        run: npx envinfo
      # ERROR INJECTION: Sleep for 90 seconds.  Combined with the 1-minute job
      # timeout above, GitHub Actions will cancel this step mid-execution and
      # report the job status as "timed out".
      - name: Simulate slow pre-build operation
        run: |
          echo "Starting pre-build setup — this step intentionally takes too long."
          sleep 90
          echo "This line is never reached due to the timeout."
      - name: Build
        working-directory: node
        run: make build-ci -j4 V=1 CONFIG_FLAGS="--error-on-warn --v8-enable-temporal-support"
      - name: Test
        working-directory: node
        run: make test-ci -j1 V=1 TEST_CI_ARGS="-p actions --measure-flakiness 9"
